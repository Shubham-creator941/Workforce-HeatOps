services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-workforce_heatops}
      MYSQL_USER: ${MYSQL_USER:-heatops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-heatops_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-heatops_root_local}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-heatops_root_local}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_data:
