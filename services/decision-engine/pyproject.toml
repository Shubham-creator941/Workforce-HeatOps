[project]
name = "workforce-heatops-decision-engine"
version = "0.1.0"
description = "Deterministic decision plane for Workforce HeatOps"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.121,<1", "pydantic-settings>=2.12,<3", "uvicorn>=0.38,<1"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "mypy>=1.18,<2", "pytest>=9,<10", "ruff>=0.14,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
